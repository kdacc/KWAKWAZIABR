  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  body { margin:0; color:var(--text); font:15px/1.45 system-ui, sans-serif;
    background:radial-gradient(ellipse at 15% 0%, #2a0f5e 0%, transparent 55%), radial-gradient(ellipse at 90% 100%, #3a0b4d 0%, transparent 50%), var(--bg); min-height:100vh; }
  #stars { position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none; }
  header, main { position:relative; z-index:1; }
  header { padding:18px 20px 14px; text-align:center; }
  header h1 { margin:0; font:700 26px system-ui, sans-serif; letter-spacing:.02em; color:#fff;
    text-shadow:0 0 6px var(--a1), 0 0 var(--g1) var(--a1), 0 0 var(--g2) var(--a2); animation:flicker 7s infinite; }
  header p { margin:6px 0 0; color:var(--dim); font-size:13px; }
  @keyframes flicker { 0%,92%,100%{opacity:1} 93%{opacity:.55} 94%{opacity:1} 96%{opacity:.7} 97%{opacity:1} }
  main { display:grid; grid-template-columns:330px 1fr; gap:18px; padding:8px 20px 28px; max-width:1240px; margin:0 auto; }
  @media (max-width:800px) { main { grid-template-columns:1fr; } }
  .panel { background:var(--panel); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:14px; padding:16px;
    box-shadow:0 0 var(--g2) rgba(157,77,255,.18), inset 0 0 24px rgba(61,123,255,.06); }
  label { display:block; font-size:12px; color:var(--dim); margin:12px 0 4px; }
  input[type=text], input[type=number], select, textarea { width:100%; padding:9px 10px; border-radius:8px; border:1px solid var(--line);
    background:rgba(5,8,22,.75); color:var(--text); font:inherit; transition:border-color .2s, box-shadow .2s; }
  input:focus, select:focus, textarea:focus, button:focus-visible { outline:none; border-color:var(--a1); box-shadow:0 0 var(--g1) var(--a1); }
  textarea { resize:vertical; }
  button { cursor:pointer; padding:8px 12px; border-radius:8px; border:1px solid var(--line); background:rgba(40,24,90,.6); color:var(--text); font:inherit; transition:.2s; }
  button:hover:not(:disabled) { border-color:var(--a1); box-shadow:0 0 var(--g1) var(--a1); }
  button.primary { background:linear-gradient(90deg,var(--a1),var(--a2)); color:#fff; border-color:transparent; font-weight:700; width:100%; margin-top:14px;
    box-shadow:0 0 var(--g1) var(--a1); text-shadow:0 1px 2px rgba(0,0,0,.4); }
  button.primary:hover:not(:disabled) { box-shadow:0 0 var(--g2) var(--a1); transform:translateY(-1px); }
  button:disabled { opacity:.45; cursor:default; }
  .presets { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .presets button { font-size:12px; padding:4px 10px; border-radius:20px; }
  .modes { display:flex; gap:14px; margin-top:6px; }
  .actions { display:flex; gap:8px; margin-top:14px; }
  .actions button.primary { margin-top:0; width:auto; flex:1; }
  button.cancel { flex:none; position:relative; white-space:nowrap; font-weight:600; color:#ff9db0; background:transparent;
    border-color:rgba(255,93,122,.45); transition:transform .12s ease, background .15s, opacity .2s, box-shadow .2s; }
  button.cancel:hover:not(:disabled) { background:rgba(255,93,122,.14); border-color:#ff5d7a; box-shadow:0 0 var(--g1) #ff5d7a; }
  button.cancel:active { transform:scale(.93); }
  button.cancel.idle { opacity:.55; }
  button.cancel.pop::after { content:""; position:absolute; inset:-1px; border-radius:8px; border:2px solid #ff9db0;
    pointer-events:none; animation:cancel-ring .45s ease-out forwards; }
  button.cancel.nudge { animation:cancel-nudge .3s; }
  @keyframes cancel-ring { from { opacity:.9; transform:scale(1); } to { opacity:0; transform:scale(1.18, 1.5); } }
  @keyframes cancel-nudge { 25% { transform:translateX(-3px); } 75% { transform:translateX(3px); } }
  .modes label { display:flex; gap:6px; align-items:center; margin:0; color:var(--text); font-size:14px; }
  input[type=radio], input[type=checkbox] { accent-color:var(--a1); }

  .fx { margin-top:16px; padding-top:4px; border-top:1px dashed var(--line); }
  .fx h4 { margin:12px 0 0; font:600 12px system-ui, sans-serif; letter-spacing:.04em; color:var(--a1); text-shadow:0 0 8px var(--a1); }
  .themes { display:flex; gap:8px; margin-top:8px; }
  .swatch { flex:1; height:30px; padding:0; border-radius:8px; border:1px solid var(--line); }
  .swatch[data-t=synth] { background:linear-gradient(90deg,#ff2e97,#9d4dff); }
  .swatch[data-t=ultra] { background:linear-gradient(90deg,#b36bff,#00d4ff); }
  .swatch[data-t=aurora] { background:linear-gradient(90deg,#00f0d0,#ff2e97); }
  .swatch.on { box-shadow:0 0 var(--g1) #fff, 0 0 var(--g2) var(--a1); border-color:#fff; }
  .row2 { display:flex; align-items:center; gap:8px; margin-top:10px; font-size:13px; }
  .row2 input[type=range] { flex:1; }
  .row2 label { margin:0; color:var(--text); display:flex; align-items:center; gap:6px; font-size:13px; }

  #stage { display:flex; flex-direction:column; gap:12px; }
  #viewer { position:relative; background:#02030c; border-radius:10px; aspect-ratio:1/1; max-height:70vh; margin:0 auto; width:100%;
    display:flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid var(--a2);
    box-shadow:0 0 var(--g1) var(--a2), 0 0 calc(40px*var(--glow)) rgba(255,46,151,.25), inset 0 0 40px rgba(157,77,255,.2); }
  #viewer::before, #viewer::after { content:""; position:absolute; width:26px; height:26px; z-index:15; pointer-events:none; border:2px solid var(--a1); filter:drop-shadow(0 0 5px var(--a1)); }
  #viewer::before { top:8px; left:8px; border-right:0; border-bottom:0; }
  #viewer::after { bottom:8px; right:8px; border-left:0; border-top:0; }
  #viewer img { width:100%; height:100%; object-fit:contain; image-rendering:pixelated; }
  #tint { position:absolute; inset:0; pointer-events:none; z-index:2; display:none; mix-blend-mode:color;
    background:linear-gradient(135deg,var(--a3),var(--a2) 50%,var(--a1)); }
  #viewer.tinted #tint { display:block; }
  #scan { position:absolute; inset:0; pointer-events:none; z-index:3; display:none; opacity:.35;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,.45) 0 1px, transparent 1px 3px); }
  #viewer.scan #scan { display:block; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; text-align:center; padding:20px; color:var(--dim); z-index:4; }
  #msg.error { color:#ff8aa0; }
  .bar { height:6px; background:rgba(5,8,22,.8); border-radius:3px; overflow:hidden; margin-top:12px; display:none; }
  .bar > div { height:100%; width:0; background:linear-gradient(90deg,var(--a3),var(--a2),var(--a1)); box-shadow:0 0 10px var(--a1); transition:width .2s; }
  #hud { position:absolute; left:12px; bottom:12px; z-index:16; background:rgba(5,3,25,.7); border:1px solid var(--line); padding:4px 10px; border-radius:6px;
    font:12px ui-monospace, monospace; color:#fff; text-shadow:0 0 6px var(--a1); }
  .controls { display:flex; gap:10px; align-items:center; }
  .small { font-size:12px; color:var(--dim); }
  .notes { color:#ffd27a; font-size:12px; margin-top:6px; }
  .hint { font-size:12px; color:var(--dim); margin-top:10px; }

  .speed-pill { padding:4px 12px; border-radius:20px; font:13px ui-monospace, monospace; white-space:nowrap; }
  .ctrl-btn { font-size:12px; padding:6px 12px; white-space:nowrap; width:auto; }
  .ctrl-btn.primary { width:auto; margin-top:0; }
  .ctrl-btn.active { background:linear-gradient(90deg,var(--a1),var(--a2)); color:#fff; border-color:transparent; box-shadow:0 0 var(--g1) var(--a1); }
  #play { width:40px; height:40px; border-radius:50%; font-size:14px; padding:0; border-color:var(--a1); box-shadow:0 0 var(--g1) var(--a1); }

  .timeline { margin-top:6px; }
  .slider-wrap { position:relative; height:34px; }
  #slider { position:relative; z-index:2; width:100%; margin:0; appearance:none; background:none; }
  #slider::-webkit-slider-runnable-track { height:6px; border-radius:3px; background:rgba(157,77,255,.25); cursor:pointer; }
  #slider::-webkit-slider-thumb { appearance:none; width:16px; height:16px; border-radius:50%; background:#fff; border:2px solid var(--a1); box-shadow:0 0 12px var(--a1); cursor:pointer; margin-top:-5px; }
  #slider::-moz-range-track { height:6px; border-radius:3px; background:rgba(157,77,255,.25); cursor:pointer; }
  #slider::-moz-range-thumb { width:14px; height:14px; border-radius:50%; background:#fff; border:2px solid var(--a1); box-shadow:0 0 12px var(--a1); cursor:pointer; }
  #selection-overlay { position:absolute; left:0; top:14px; height:6px; border-radius:3px; background:var(--a1); opacity:.7; box-shadow:0 0 10px var(--a1); display:none; pointer-events:none; z-index:1; transition:left .2s,width .2s; }
  .ticks { position:relative; height:12px; margin-top:4px; }
  .tick { width:1px; height:6px; background:var(--dim); position:absolute; bottom:0; pointer-events:none; }
  .tick.active { background:var(--a1); height:10px; bottom:-2px; box-shadow:0 0 6px var(--a1); }
  .time-labels { display:flex; justify-content:space-between; font-size:11px; color:var(--dim); margin-top:4px; }
  
  .coord-row { display:flex; gap:8px; align-items:center; margin-top:10px; }
  .coord-row label { flex:none; width:30px; margin:0; font-weight:700; color:var(--text); }
  .coord-row input { flex:1; min-width:0; }
  .coord-row select, .static-unit { flex:none; width:122px; padding:9px 8px; font-size:12px; text-align:center; border-radius:8px; }
  .static-unit { color:var(--dim); background:rgba(5,8,22,.55); border:1px dashed var(--line); }

  .wide-btn { width:100%; margin-top:8px; }
  #region-canvas { position:absolute; inset:0; width:100%; height:100%; z-index:10; pointer-events:none; }
  #region-canvas.selecting { pointer-events:auto; cursor:crosshair; touch-action:none; }
  #select-hint { position:absolute; top:12px; left:50%; transform:translateX(-50%); z-index:20; max-width:80%; text-align:center;
    background:rgba(5,3,25,.85); border:1px solid var(--a1); box-shadow:0 0 var(--g1) var(--a1); color:var(--text); padding:6px 12px; border-radius:6px; font-size:12px; pointer-events:none; }
  #report-panel h3 { margin:0 0 4px; font:600 14px system-ui, sans-serif; letter-spacing:.02em; color:var(--a1); text-shadow:0 0 8px var(--a1); }
  #report-panel .field { margin-bottom:4px; }
  #report-panel input[readonly] { color:var(--dim); cursor:default; }
  #report-panel .unit { display:block; font-size:11px; color:var(--dim); margin-top:2px; }
  #report-panel input.invalid { border-color:var(--danger); }
  .file-card { display:flex; gap:10px; align-items:center; border:1px solid var(--line); border-radius:8px; padding:8px; background:rgba(5,8,22,.75); }
  .file-card img { width:56px; height:56px; object-fit:contain; background:#000; border-radius:4px; image-rendering:pixelated; flex:none; }

function getTargetValue() {
  const ra = $("target-ra").value.trim();
  const dec = $("target-dec").value.trim();
  return dec ? `${ra} ${dec}`.trim() : ra;
}

function applyUrl() {
  const q = new URLSearchParams(location.search);
  const t = q.get("target");

  if (t) {
    const parts = t.split(/\s+(?=[+-])/);
    if (parts.length === 2) {
      $("target-ra").value = parts[0].trim();
      $("target-dec").value = parts[1].trim();
    } else {
      $("target-ra").value = t;
    }
  } else if (q.get("ra") && q.get("dec")) {
    $("target-ra").value = q.get("ra");
    $("target-dec").value = q.get("dec");
  }

  if (q.get("fov")) $("fov").value = q.get("fov");
  if (q.get("det")) $("det").value = q.get("det");

  const diffRadio = document.querySelector('input[value=diff]');
  if (q.get("mode") === "diff" && diffRadio) diffRadio.checked = true;

  if (t || (q.get("ra") && q.get("dec"))) start();
}

function updateUrl() {
  const q = new URLSearchParams({target: getTargetValue(), fov: $("fov").value, det: $("det").value,
    mode: document.querySelector('input[name=mode]:checked').value});
  history.replaceState(null, "", "?" + q.toString());
}

  $("img").hidden = true; $("hud").hidden = true; $("notes").textContent = "";

    const body = await r.json().catch(() => ({}));

  try {
    const s = await (await fetch("/api/jobs/" + id)).json();
    if (id !== job) return;
    if (s.status === "cancelled") { clearInterval(poll); return cancelled(); }
    if (s.status === "error") { clearInterval(poll); return fail(s.error); }
    $("status").textContent = (STAGES[s.stage] || s.stage) + (s.total > 1 ? ` — ${s.done}/${s.total}` : "");
    setBar(s.total ? s.done / s.total : 0);

}
function show(i) {
  cur = i; const f = frames[i];
  const im = $("img"); im.hidden = false;
  im.src = images[mode][i] && images[mode][i].complete ? images[mode][i].src : url(i, mode);
  $("slider").value = i;
  updateActiveTick(i);
  if (cutMode) {
    if (selStart === null) selStart = i;
    if (selEnd === null) selEnd = i;
    else if (i >= selStart && i > selEnd) selEnd = i;
    renderSelection();
  }
  const hud = $("hud"); hud.hidden = false;
  hud.textContent = `${i + 1}/${frames.length}  ${f.utc || "MJD " + f.time.toFixed(3)}  λ ≈ ${f.wavelength_um ?? "?"} μm`;
}
function play() { stopPlay(); $("play").textContent = "⏸";
  const fps = 4 * speedMult;
  timer = setInterval(() => show((cur + 1) % frames.length), 1000 / fps); }
function stopPlay() { clearInterval(timer); timer = null; $("play").textContent = "▶"; }
$("play").onclick = () => timer ? stopPlay() : play();
$("slider").oninput = e => {
  stopPlay(); let i = parseInt(e.target.value);
  if (cutMode && selStart !== null && i < selStart) i = selStart;
  $("slider").value = i;
  show(i);
  if (cutMode && selStart !== null) { selEnd = i; renderSelection(); }
};
document.querySelectorAll('input[name=mode]').forEach(r => r.onchange = e => {
  mode = e.target.value; updateUrl();
  if (!frames.length) return; preload(mode); show(cur);
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && selection.active) { cancelAreaSelection(); return; }
  if (!frames.length) return;
  if (e.target.matches("input:not([type=range]), textarea, select")) return;
  const onSlider = e.target.matches("input[type=range]");
  if (e.key === "ArrowRight" && !onSlider) { stopPlay(); show((cur + 1) % frames.length); }
  if (e.key === "ArrowLeft" && !onSlider) { stopPlay(); show((cur - 1 + frames.length) % frames.length); }
  if (e.key === " ") { e.preventDefault(); $("play").click(); }
});

const MIN_SELECTION_PX = 12;
const SNAPSHOT_COLOR = "#ff0000";
const OVERLAY_COLOR = "#ff2e97";
const report = {active: false, jobId: null, mode: "raw", region: null, attached: false, pending: false, dataUrl: null, token: 0};
const selection = {active: false, dragging: false, startX: 0, startY: 0, onDone: null};

const frameDateLabel = f => f.utc || `MJD ${f.time.toFixed(3)}`;

function updateReportButton() {
  const button = $("btn-report");
  button.textContent = selection.active ? "Cancel area selection" : "Make a Report";
  button.disabled = !lastResult;
  $("main-actions").hidden = selection.active || report.active;
  $("select-cancel").hidden = !selection.active;
  $("report-panel").classList.toggle("selecting", selection.active);
}

function imageContentRect() {
  const img = $("img"), box = img.getBoundingClientRect();
  if (!img.naturalWidth || !img.naturalHeight) return box;
  const scale = Math.min(box.width / img.naturalWidth, box.height / img.naturalHeight);
  const width = img.naturalWidth * scale, height = img.naturalHeight * scale;
  return {left: box.left + (box.width - width) / 2, top: box.top + (box.height - height) / 2, width, height};
}
function clientRectToRegion(rect) {
  const r = imageContentRect(), clamp01 = v => Math.min(1, Math.max(0, v));
  const x = clamp01((rect.left - r.left) / r.width), y = clamp01((rect.top - r.top) / r.height);
  return {x, y, w: Math.min(rect.width / r.width, 1 - x), h: Math.min(rect.height / r.height, 1 - y)};
}
function regionToClientRect(region) {
  const r = imageContentRect();
  return {left: r.left + region.x * r.width, top: r.top + region.y * r.height, width: region.w * r.width, height: region.h * r.height};
}

function overlayCanvas() {
  let canvas = $("region-canvas");
  if (!canvas) { canvas = document.createElement("canvas"); canvas.id = "region-canvas"; $("viewer").appendChild(canvas); }
  const viewer = $("viewer");
  if (canvas.width !== viewer.clientWidth || canvas.height !== viewer.clientHeight) {
    canvas.width = viewer.clientWidth; canvas.height = viewer.clientHeight;
  }
  return canvas;
}
function removeOverlay() { const canvas = $("region-canvas"); if (canvas) canvas.remove(); }
function drawOverlay(clientRect) {
  const canvas = overlayCanvas(), ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (!clientRect) return;
  const origin = $("viewer").getBoundingClientRect();
  const x = clientRect.left - origin.left, y = clientRect.top - origin.top;
  ctx.fillStyle = "rgba(255, 46, 151, 0.15)"; ctx.fillRect(x, y, clientRect.width, clientRect.height);
  ctx.shadowColor = OVERLAY_COLOR; ctx.shadowBlur = 14;
  ctx.strokeStyle = OVERLAY_COLOR; ctx.lineWidth = 2; ctx.strokeRect(x, y, clientRect.width, clientRect.height);
}
window.addEventListener("resize", () => {
  if (report.active && report.region && !selection.active) drawOverlay(regionToClientRect(report.region));
});

function pointInImage(e) {
  const r = imageContentRect();
  return {x: Math.min(Math.max(e.clientX, r.left), r.left + r.width), y: Math.min(Math.max(e.clientY, r.top), r.top + r.height)};
}
function dragRect(point) {
  return {left: Math.min(selection.startX, point.x), top: Math.min(selection.startY, point.y),
          width: Math.abs(point.x - selection.startX), height: Math.abs(point.y - selection.startY)};
}
function startAreaSelection(onDone) {
  stopPlay();
  Object.assign(selection, {active: true, dragging: false, onDone});
  const canvas = overlayCanvas();
  canvas.classList.add("selecting");
  drawOverlay(null);
  const hint = $("select-hint");
  hint.hidden = false;
  hint.textContent = "Select an area on the frame: press the mouse button and drag. Esc — cancel.";
  updateReportButton();

  canvas.onpointerdown = e => {
    selection.dragging = true;
    canvas.setPointerCapture(e.pointerId);
    const p = pointInImage(e);
    selection.startX = p.x; selection.startY = p.y;
    drawOverlay(null);
  };
  canvas.onpointermove = e => { if (selection.dragging) drawOverlay(dragRect(pointInImage(e))); };
  canvas.onpointerup = e => {
    if (!selection.dragging) return;
    selection.dragging = false;
    const rect = dragRect(pointInImage(e));
    if (rect.width < MIN_SELECTION_PX || rect.height < MIN_SELECTION_PX) {
      drawOverlay(null);
      hint.textContent = "Area too small — try again.";
      return;
    }
    const done = selection.onDone;
    endSelectionUi();
    drawOverlay(rect);
    done(clientRectToRegion(rect));
  };
  canvas.onpointercancel = () => { selection.dragging = false; drawOverlay(null); };
}
function endSelectionUi() {
  selection.active = false; selection.dragging = false;
  $("select-hint").hidden = true;
  const canvas = $("region-canvas");
  if (canvas) canvas.classList.remove("selecting");
  updateReportButton();
}
function cancelAreaSelection() {
  endSelectionUi();
  if (report.active && report.region) drawOverlay(regionToClientRect(report.region)); else removeOverlay();
}

$("btn-report").onclick = () => {
  if (selection.active) return cancelAreaSelection();
  if (lastResult) startAreaSelection(openReportForm);
};

function openReportForm(region) {
  const meta = lastResult.meta;
  Object.assign(report, {active: true, jobId: job, mode, region, attached: true, pending: false, dataUrl: null});
  $("report-ra").value = Number(meta.ra).toFixed(6);
  $("report-dec").value = Number(meta.dec).toFixed(6);
  $("report-detector").value = `D${meta.detector}`;
  $("report-det-band").textContent = `${meta.band_um[0]}–${meta.band_um[1]} μm`;
  $("report-fov").value = meta.fov_deg;
  $("report-total").value = lastResult.count;
  const frameInput = $("report-frame");
  frameInput.min = 1; frameInput.max = lastResult.count; frameInput.value = cur + 1;
  $("report-frame-hint").textContent = `from 1 to ${lastResult.count}`;
  $("report-notes").value = "";
  setReportStatus("");
  $("settings-content").hidden = true;
  $("main-actions").hidden = true;
  $("report-panel").hidden = false;
  onReportFrameChanged();
}
function readReportFrameNumber() {
  const n = Number($("report-frame").value);
  return Number.isInteger(n) && n >= 1 && n <= lastResult.count ? n : null;
}
function onReportFrameChanged() {
  const n = readReportFrameNumber();
  $("report-frame").classList.toggle("invalid", n === null);
  $("report-date").value = n === null ? "" : frameDateLabel(frames[n - 1]);
  if (n !== null && report.attached) renderAreaSnapshot(n - 1);
  refreshSaveButton();
}
$("report-frame").oninput = onReportFrameChanged;

function refreshSaveButton() {
  $("btn-save-report").disabled = readReportFrameNumber() === null || (report.attached && report.pending);
}
function setReportStatus(text, isError) {
  const el = $("report-status");
  el.textContent = text; el.className = isError ? "error" : "";
}
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const image = new Image();
    image.onload = () => resolve(image);
    image.onerror = () => reject(new Error("frame failed to load"));
    image.src = src;
  });
}

async function renderAreaSnapshot(frameIndex) {
  const token = ++report.token;
  report.pending = true; report.dataUrl = null;
  refreshSaveButton();
  try {
    const image = await loadImage(url(frameIndex, report.mode));
    if (token !== report.token) return;
    const canvas = document.createElement("canvas");
    canvas.width = image.naturalWidth; canvas.height = image.naturalHeight;
    const ctx = canvas.getContext("2d"), {x, y, w, h} = report.region;
    ctx.drawImage(image, 0, 0);
    ctx.strokeStyle = SNAPSHOT_COLOR; ctx.lineWidth = Math.max(2, Math.round(canvas.width / 100));
    ctx.strokeRect(x * canvas.width, y * canvas.height, w * canvas.width, h * canvas.height);
    report.dataUrl = canvas.toDataURL("image/png");
    $("report-thumb").src = report.dataUrl;
    $("report-file-name").textContent = `frame_${frameIndex + 1}_area.png`;
    $("report-file").hidden = false; $("report-no-file").hidden = true;
    setReportStatus("");
  } catch (e) {
    if (token === report.token) setReportStatus("Could not prepare the snapshot: " + e.message, true);
  } finally {
    if (token === report.token) { report.pending = false; refreshSaveButton(); }
  }
}

$("btn-delete-area-file").onclick = () => {
  report.token++;
  Object.assign(report, {attached: false, pending: false, dataUrl: null});
  $("report-file").hidden = true; $("report-no-file").hidden = false;
  refreshSaveButton();
};
$("btn-reselect-area").onclick = () => startAreaSelection(region => {
  report.region = region; report.attached = true;
  onReportFrameChanged();
});

async function describeError(response) {
  const body = await response.json().catch(() => ({}));
  const d = body.detail;
  return !d ? response.statusText : typeof d === "string" ? d : JSON.stringify(d);
}
$("btn-save-report").onclick = async () => {
  const n = readReportFrameNumber();
  if (n === null) return;
  const button = $("btn-save-report");
  button.disabled = true; button.textContent = "Generating…";
  try {
    const response = await fetch(`/api/jobs/${report.jobId}/report`, {
      method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({frame_number: n, notes: $("report-notes").value,
        region: report.attached ? report.region : null, area_image: report.attached ? report.dataUrl : null}),
    });
    if (!response.ok) throw new Error(await describeError(response));
    downloadBlob(await response.blob(), `SPHEREx_report_${report.jobId}_frame_${n}.pdf`);
    closeReport();
    $("status").textContent = "Report saved to your browser's downloads folder.";
  } catch (e) {
    setReportStatus(e.message, true);
  } finally {
    button.textContent = "Save PDF";
    refreshSaveButton();
  }
};

function closeReport() {
  Object.assign(report, {active: false, region: null, attached: false, pending: false, dataUrl: null, token: report.token + 1});
  $("report-panel").hidden = true;
  $("settings-content").hidden = false;
  if (selection.active) cancelAreaSelection(); else removeOverlay();
  updateReportButton();
}
$("btn-cancel-report").onclick = closeReport;
$("select-cancel").onclick = () => cancelAreaSelection();
</script>
</body>
</html>
